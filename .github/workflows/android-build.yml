name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # 注意：lint 已禁用 —— AGP 8.7.x 内置 lint 与 Kotlin 2.1 UAST 存在已知崩溃
      # （IncompatibleClassChangeError: NonNullableMutableLiveDataDetector），属上游工具链问题，
      # 本地/CI 均复现；见 android/app/build.gradle.kts 的 lint 块说明。修复后恢复：
      #   run: ./gradlew lintDebug
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lelebox-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build release APK (signed with debug key for now)
        run: ./gradlew assembleRelease
